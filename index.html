    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <script>
      try {
        if (localStorage.getItem('mero_routine_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
      window.__deferredPwaPrompt = null;
      window.__meroDeferredPrompt = null;
      try {
        if (
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: minimal-ui)').matches ||
          window.navigator.standalone === true ||
          (document.referrer && document.referrer.indexOf('android-app://') !== -1)
        ) {
          localStorage.setItem('mero_routine_pwa_installed_v1', 'true');
        }
      } catch (e) {}
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/', updateViaCache: 'none' })
          .catch(function () {});
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.__meroDeferredPrompt = e;
        try {
          if (
            !window.matchMedia('(display-mode: standalone)').matches &&
            !window.matchMedia('(display-mode: minimal-ui)').matches &&
            window.navigator.standalone !== true
          ) {
            localStorage.removeItem('mero_routine_pwa_installed_v1');
          }
        } catch (err) {}
        window.dispatchEvent(new Event('mero-pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredPwaPrompt = null;
        window.__meroDeferredPrompt = null;
        try {
          localStorage.setItem('mero_routine_pwa_installed_v1', 'true');
        } catch (e) {}
        window.dispatchEvent(new Event('mero-pwa-installed'));
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700&display=swap" rel="stylesheet" />

          <p style="font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:600;color:#334155;margin:0;">Mero Routine</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
